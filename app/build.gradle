plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sbplus.browser'
    // 2026-10-04 升级：34 → 37。
    // 原因：libxposed:service:102.0.0（用于读取模块激活状态与作用域）的 AAR 元数据
    // 要求 compileSdk ≥ 37。
    //
    // 注意用的是**新版带次版本号的 DSL**，不是旧的 `compileSdk 37`：
    // 新版 SDK 把 Android 37 的平台目录装成了 `platforms/android-37.0`
    // （source.properties 里 AndroidVersion.ApiLevel=37.0），旧的整数写法会去找
    // `android-37` 而报 "Failed to find target with hash string 'android-37'"。
    // 必须用 compileSdk { version = release(37) { minorApiLevel = 0 } } 才能匹配到。
    //
    // targetSdk 保持 34 不动：升 targetSdk 会引入 Android 14/15 的行为变更
    // （前台服务类型、存储权限、后台限制等），那是独立的一次改动，不应与
    // "加个状态显示"混在一起。compileSdk 只影响"能调用哪些 API"，
    // 不改变运行时行为，故单独升级是安全的。
    compileSdk {
        version = release(37) {
            minorApiLevel = 0
        }
    }

    defaultConfig {
        applicationId "com.sbplus.browser"
        // 2026-10-04 升级：24 → 26。
        // 原因：libxposed:service:102.0.0 的 AAR 声明 minSdk 26，Gradle 拒绝与 24 合并。
        //
        // 为什么定 26 而不是更高：
        // 实测本机三星浏览器两个版本 —— 30.1.0.67 的 minSdk=30、29.1.5.3(beta) 的 minSdk=29。
        // 即"能装上本模块所支持浏览器的设备"系统必然 ≥ API 29，故抬到 26 实际
        // **一个用户都不会少**；而抬到 30 反而会排除 API 29 上跑 beta 浏览器的用户。
        // 再往上（如"最新"的 37）会让模块几乎无法安装在任何现役设备上，不取。
        //
        // 注：本模块的兼容负担来自**浏览器版本**而非系统 API，已由 safeFeature 逐功能
        // 隔离，因此提高 minSdk 并不会减少需要维护的兼容代码 —— 没有额外收益。
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "2.6.0"

        // 把版本号注入到普通类也能读到的位置。
        // 背景:MainHook 运行在**三星浏览器进程**里,加载不到模块自己的 BuildConfig,
        // 也没法从 prefs 保证读到(MainActivity 没打开过就是空),所以它需要一个
        // 编译期就固化的兜底版本号。以前是手写常量,已经漂移到 2.5.1(实际 2.5.3)。
        // 这里由 Gradle 注入,以后只改上面 versionName 一处,两边自动一致。
        // 字段名必须叫 SBPLUS_VERSION,MainHook.APP_VERSION 会优先读它。
        buildConfigField "String", "SBPLUS_VERSION", "\"${versionName}\""
    }

    signingConfigs {
        release {
            // 签名密码在本地 ~/.gradle/gradle.properties 提供(SBPLUS_*), 不提交到仓库。
            // 关键:只有在两个密码都齐备时才注册签名配置的 storeFile——否则
            // assembleRelease 会"成功"产出一个用空口令签名的 APK,安装时报
            // "应用未安装",而错误要到发布之后才暴露。缺失时由下面的 buildTypes
            // 让 release 构建显式失败。
            def storePass = project.findProperty("SBPLUS_STORE_PASSWORD")
            def keyPass = project.findProperty("SBPLUS_KEY_PASSWORD")
            if (storePass && keyPass) {
                storeFile file("../release.keystore")
                storePassword storePass
                keyAlias project.findProperty("SBPLUS_KEY_ALIAS") ?: "sbplus"
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            // 反射解析宿主(三星浏览器)的混淆后类名/方法名依赖原样保留的字符串,
            // 开启收缩会立刻引发大面积 NoSuchMethodError,故显式关闭。
            // 注意:原实现同时列出了 proguardFiles,但 proguardFiles 仅在
            // minifyEnabled true 时参与——留着它只会让后来者误以为 release
            // 已做优化混淆,故一并删除。
            minifyEnabled false
            shrinkResources false
            // 用 hasProperty 兜底:未设置 storeFile 时该属性可能不存在,
            // 直接读属性在某些 AGP 版本上会抛 MissingPropertyException。
            def configured = signingConfigs.release.hasProperty("storeFile")
                    && signingConfigs.release.storeFile != null
            if (configured) {
                signingConfig signingConfigs.release
            } else {
                gradle.taskGraph.whenReady { graph ->
                    if (graph.hasTask(":app:assembleRelease")
                            || graph.hasTask(":app:bundleRelease")) {
                        throw new GradleException(
                                "缺少 SBPLUS_STORE_PASSWORD / SBPLUS_KEY_PASSWORD," +
                                        "拒绝产出未签名的 release 包。" +
                                        "请在 ~/.gradle/gradle.properties 中配置后重试。")
                    }
                }
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // 2026-10-04 新增：开启 core library desugaring。
        //
        // 原因：libxposed:service:102.0.0 内部使用了 Java Record（其 HookedTarget$State
        // 等类型由 record 编译而来）。D8 在把该 AAR 转 dex 时报
        //   "Invalid build configuration. Attempt to create a global synthetic for
        //    'Record desugaring' without a global-synthetics consumer."
        // —— Record 脱糖需要 desugaring 管线来承接它生成的全局合成类。
        // 开启 coreLibraryDesugaring 即提供该承接者。
        //
        // 注意：必须同时声明 dependencies 里的 desugar_jdk_libs，否则 Gradle 会报
        // "coreLibraryDesugaring is enabled but no desugar_jdk_libs dependency"。
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    // LSPosed 新 API（compileOnly，运行时由 LSPosed 框架提供）
    compileOnly files('libs/libxposed-api-102.jar')

    // 2026-10-04 新增：libxposed service —— 在模块进程内读取**激活状态与作用域**。
    //
    // 为什么需要它：LSPosed 会把 XposedService 绑定到模块进程，从中可读到
    //   · getFrameworkName/Version  —— 框架名与版本（service 为空即代表未激活）
    //   · getScope()                —— 模块作用域列表（判断是否勾选了三星浏览器）
    // 这是官方提供的正路，比"靠 hook 写标记、界面再读日志"可靠得多。
    // 参考实现：WeKit（github.com/Ujhhgtg/WeKit）的 HookStatus 用的就是这套。
    //
    // **版本选择说明**：用 102.0.0（与项目现有的 libxposed-api-102.jar 同版本）。
    // 102 的 HotReloadResult 是 Java Record 编译产物，Record 脱糖需要"全局合成类"，
    // 而 AGP 默认在 dex 化外部库时不生成它 —— 已在 gradle.properties 里通过
    // android.enableGlobalSyntheticsGeneration=true 解决（详见该文件注释）。
    // 不必降级到 101：101 反而多依赖 kotlin-stdlib，且缺少 HookedTarget
    // （getRunningTargets 需要它，可用来判断浏览器是否已加载模块）。
    implementation 'io.github.libxposed:service:102.0.0'

    // 旧 Xposed API 已移除，XC_MethodHook/MethodHookParam 使用自实现（非 stub）

    // androidx.fragment（compileOnly：运行时由目标应用三星浏览器提供，
    // 编译期仅需能解析 android x.fragment.app.Fragment 基类）
    compileOnly 'androidx.fragment:fragment:1.6.2'

    // 2026-10-04 新增：core library desugaring 的运行时库。
    // 配合 compileOptions.coreLibraryDesugaringEnabled —— 承接 libxposed:service
    // 里 Java Record 脱糖生成的全局合成类（详见 compileOptions 处的说明）。
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
