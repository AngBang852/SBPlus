plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sbplus.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.sbplus.browser"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "2.5"
    }

    signingConfigs {
        release {
            storeFile file("../release.keystore")
            // 签名密码在本地 ~/.gradle/gradle.properties 提供(SBPLUS_*), 不提交到仓库
            storePassword project.findProperty("SBPLUS_STORE_PASSWORD") ?: ""
            keyAlias project.findProperty("SBPLUS_KEY_ALIAS") ?: "sbplus"
            keyPassword project.findProperty("SBPLUS_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Xposed API（compileOnly，运行时由 LSPosed/framework 提供）
    compileOnly 'de.robv.android.xposed:api:82'

    // androidx.fragment（compileOnly：运行时由目标应用三星浏览器提供，
    // 编译期仅需能解析 android x.fragment.app.Fragment 基类）
    compileOnly 'androidx.fragment:fragment:1.6.2'
}
