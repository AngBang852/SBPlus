plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sbplus.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.sbplus.browser"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "2.2"
    }

    signingConfigs {
        release {
            storeFile file("../release.keystore")
            storePassword "REDACTED_USE_LOCAL_GRADLE_PROPERTIES"
            keyAlias "sbplus"
            keyPassword "REDACTED_USE_LOCAL_GRADLE_PROPERTIES"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Xposed API（compileOnly，运行时由 LSPosed/framework 提供）
    compileOnly 'de.robv.android.xposed:api:82'

    // androidx.fragment（compileOnly：运行时由目标应用三星浏览器提供，
    // 编译期仅需能解析 android x.fragment.app.Fragment 基类）
    compileOnly 'androidx.fragment:fragment:1.6.2'
}
