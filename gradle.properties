org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# 项目路径可能含非 ASCII 字符（如中文目录），AGP 默认拒绝，这里显式放行
android.overridePathCheck=true

# 2026-10-04 新增：允许 D8 生成全局合成类（global synthetics）。
#
# 原因：libxposed:service:102.0.0 里的 HotReloadResult 是 Java Record 编译产物，
# Record 脱糖会产生"全局合成类"。AGP 在 dex 化**外部库**时
# （mergeExtDexDebug → DexingNoClasspathTransform）默认不生成它，于是报：
#   "D8: Invalid build configuration. Attempt to create a global synthetic for
#    'Record desugaring' without a global-synthetics consumer."
#
# 属性名取自 AGP 的 OptionalBooleanOption.ENABLE_API_MODELING_AND_GLOBAL_SYNTHETICS
# （字符串常量 android.enableApiModelingAndGlobalSynthetics，已从 gradle-8.13.0.jar 确认）。
# 注意不要写成 android.enableGlobalSyntheticsGeneration —— 那是已被 AGP 标记
# deprecated 的旧名，写了也不生效（实测会打出 deprecation 警告但开关仍为 false）。
#
# AGP 的默认判定逻辑（反编译 ComponentImpl.isGlobalSyntheticsEnabled 得到）：
#   本属性若显式设置 → 用它；
#   否则 → debuggable && sourceCompatibility ≥ Java 14。
# 本项目 sourceCompatibility 是 11（低于 14），故 release 下默认关闭，
# 必须显式开启本属性才能 dex 化含 Record 的库。
android.enableApiModelingAndGlobalSynthetics=true
